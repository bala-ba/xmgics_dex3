# Export contains checkpoint EMA weights, PD parameters and resampled references.
export_dir: policy/instant_track/model/ckpt_438000_run1_subject2_first_forward
dt: 0.01
control:
  decimation: 2
  preparation_seconds: 2.0
  entry_max_joint_error: 0.35  # rad: legs/waist vs first reference, before READY and on p
